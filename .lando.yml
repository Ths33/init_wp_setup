name:
recipe: wordpress
config:
  php: "8.2"
  via: apache
  composer_version: "2"
  webroot: .
  database: mysql
  xdebug: false

proxy:
  appserver:
    - PROXY_URL

services:
  redis:
    type: redis:7

  appserver:
    ssl: true
    build_as_root:
      - php -m | grep -q redis || (pecl install redis && docker-php-ext-enable redis)
    overrides:
      environment:
        XDEBUG_MODE: "debug,develop"
        XDEBUG_SESSION: "VSCODE"
        XDEBUG_CONFIG: "client_host=host.docker.internal client_port=9003 start_with_request=trigger idekey=VSCODE log=/tmp/xdebug.log discover_client_host=0"

  mailhog:
    type: mailhog
    hogfrom:
      - appserver

  pma:
    type: phpmyadmin
    hosts:
      - database

tooling:
  xdebug-on:
    service: appserver
    description: Enable Xdebug (step debugging on port 9003)
    cmd: docker-php-ext-enable xdebug && apache2ctl graceful && echo "Xdebug enabled"
    user: root
  xdebug-off:
    service: appserver
    description: Disable Xdebug
    cmd: rm -f /usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini && apache2ctl graceful && echo "Xdebug disabled"
    user: root
  xdebug-log:
    service: appserver
    description: Tail Xdebug log
    cmd: tail -f /tmp/xdebug.log
    user: root
